<h2 class="CAN">Create an Account</h2>

<div id="inputs">
<form id="registerForm" action="#" method="post">

<label for="name">Full Name:</label><br>
<input type="text" id="name" name="name" placeholder="e.g. Spongebob Squarepants" required ><br><br>

<label for="email">Email:</label><br>
<input type="email" id="email" name="email" placeholder="e.g. bikinibottom@example.com" required><br><br>

<label for="username">Username:</label><br>
<input type="text" id="username" name="username" placeholder="e.g. spongebob" required><br><br>

<label for="password">Password:</label><br>
<input type="password" id="password" name="password" placeholder="********" required><br><br>

<label for="confirm">Confirm Password:</label><br>
<input type="password" id="confirm" name="confirm" placeholder="********" required><br><br>

<label for="gender">Gender:</label><br>
<select id="gender" name="gender">
<option value="male">Male</option>
<option value="female">Female</option>
<option value="other">Other</option>
</select><br><br>

<label>


<button type="submit">Register</button>

<p class="DHAA">Already have an account? <a href="login.html">Login here</a>.</p>

</form>
