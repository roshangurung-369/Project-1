<header>
  <div class="hero-tag">🏆 Sport Week 2025</div>
  <h1>SPORT<br/><span>WEEK</span></h1>
  <p class="hero-sub">Manage participants across all sports events in one place. Select a sport, add a name, done.</p>
</header>

<section class="sport-manager" aria-label="Sport Participant Manager">
  <h2 class="sm-title">Add Participants</h2>
  <div class="sm-controls">
    <select id="sportSelect" aria-label="Choose sport">
      <option value="">Select Sport</option>
      <option value="football">⚽ Football</option>
      <option value="basketball">🏀 Basketball</option>
      <option value="cricket">🏏 Cricket</option>
      <option value="tennis">🎾 Tennis</option>
      <option value="volleyball">🏐 Volleyball</option>
      <option value="swimming">🏊 Swimming</option>
    </select>
    <input type="text" id="playerName" placeholder="Enter participant name…" aria-label="Participant name" maxlength="40" />
    <button onclick="addPlayer()">Add</button>
  </div>

  <div class="sport-sections" id="sportSections">
  </div>
</section>
